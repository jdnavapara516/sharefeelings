version: "3.9"

services:

  db:
    image: postgres:17

    container_name: sharethought-db

    restart: always

    env_file:
      - backend/.env

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

  web:
    build:
      context: ./backend

    container_name: sharethought-web

    restart: always

    env_file:
      - backend/.env

    command: >
      sh -c "
      python manage.py migrate &&
      gunicorn app.wsgi:application --bind 0.0.0.0:8000
      "

    volumes:
      - ./backend:/app

    expose:
      - "8000"

    depends_on:
      - db

  nginx:
    image: nginx:latest

    container_name: sharethought-nginx

    ports:
      - "8081:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - web

volumes:
  postgres_data: